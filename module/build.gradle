import com.v7878.zygisk.gradle.ZygoteLoader

buildscript {
    repositories {
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }
    dependencies {
        // 直接引入 Jar 包，繞過 Plugin Marker 檢查
        // 使用 master-SNAPSHOT (因為這是 GitHub 預設分支)
        classpath 'com.github.vova7878.ZygoteLoader:plugin:v1.1.0'
    }
}

plugins {
    alias(libs.plugins.android.application)
}

apply plugin: 'com.github.vova7878.ZygoteLoader'

def updateJsonBase = "https://raw.githubusercontent.com/vova7878-modules/PMPatch/main/updates/"

android {
    namespace 'com.v7878.hooks.pmpatch'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
        versionCode 1_002_000
        versionName "v1.2.0"

        buildConfigField("boolean", "RUN_FOR_APPLICATIONS", "false")
        buildConfigField("boolean", "RUN_FOR_SYSTEM_SERVER", "true")
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    flavorDimensions += ["patch"]
    productFlavors {
        patch12 {
            dimension "patch"

            zygisk {
                packages(ZygoteLoader.ALL_PACKAGES)

                id = "com_v7878_pmpatch_12"
                name = "PMPatch12"
                updateJson = "${updateJsonBase}update_12.json"
                archiveName = "PMPatch12"
            }

            buildConfigField("boolean", "PATCH_1", "true")
            buildConfigField("boolean", "PATCH_2", "true")
            buildConfigField("boolean", "PATCH_3", "false")
            buildConfigField("boolean", "USE_CONFIG", "false")
        }
        patch3 {
            dimension "patch"

            zygisk {
                packages(ZygoteLoader.PACKAGE_SYSTEM_SERVER)

                id = "com_v7878_pmpatch_3"
                name = "PMPatch3"
                updateJson = "${updateJsonBase}update_3.json"
                archiveName = "PMPatch3"
            }

            buildConfigField("boolean", "PATCH_1", "false")
            buildConfigField("boolean", "PATCH_2", "false")
            buildConfigField("boolean", "PATCH_3", "true")
            buildConfigField("boolean", "USE_CONFIG", "false")
        }
        full {
            dimension "patch"

            zygisk {
                packages(ZygoteLoader.ALL_PACKAGES)

                id = "com_v7878_pmpatch_full"
                name = "PMPatchFull"
                updateJson = "${updateJsonBase}update_full.json"
                archiveName = "PMPatchFull"
            }

            buildConfigField("boolean", "PATCH_1", "true")
            buildConfigField("boolean", "PATCH_2", "true")
            buildConfigField("boolean", "PATCH_3", "true")
            buildConfigField("boolean", "USE_CONFIG", "false")
        }
        // Configurable version where you can enable and disable
        // any of the patches without rebuilding (exists specifically for LuckyPatcher)
        LP {
            dimension "patch"

            zygisk {
                packages(ZygoteLoader.ALL_PACKAGES)

                property("PATCH_1", "true")
                property("PATCH_2", "true")
                property("PATCH_3", "true")

                id = "com_v7878_pmpatch_lp"
                name = "PMPatchLP"
                archiveName = "PMPatchLP"
            }

            buildConfigField("boolean", "PATCH_1", "true")
            buildConfigField("boolean", "PATCH_2", "true")
            buildConfigField("boolean", "PATCH_3", "true")
            buildConfigField("boolean", "USE_CONFIG", "true")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

zygisk {
    author = "v7878"
    description = "Disable signature verification For Android"
    entrypoint = "com.v7878.hooks.pmpatch.Main"
    attachNativeLibs = false
    generateChecksums = true
}

dependencies {
    implementation libs.androidvmtools
    implementation libs.r8.annotations
    implementation 'com.github.vova7878:DexFile:v1.2.2'
}

configurations.all {
    resolutionStrategy {
        // 根據你提供的列表，v1.2.2 是目前最新的穩定 Release Tag
        // 使用 Tag 版本通常下載最快，且不容易出錯
        force 'com.github.vova7878:DexFile:v1.2.2'
        
        // 防止 Gradle 快取
        cacheDynamicVersionsFor 0, 'seconds'
        cacheChangingModulesFor 0, 'seconds'
    }
}
